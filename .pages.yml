# Pages CMS (https://app.pagescms.org) - browser editor for this site.
# Saving an entry commits straight to main, which deploys the site.
settings:
  content:
    merge: true # keep any front matter field not listed below

media:
  input: static/images
  output: /images
  categories: [image]

content:
  - name: labs
    label: Labs
    type: collection
    path: content/labs
    format: toml-frontmatter
    exclude: [_index.md]
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        description: Drafts are saved but not published.
      - name: description
        label: Description
        type: text
        description: Shown on the card and in link previews.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Content
        type: code
        options:
          format: markdown

  - name: sheets
    label: Cheat sheets
    type: collection
    path: content/sheets
    format: toml-frontmatter
    exclude: [_index.md]
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        description: Drafts are saved but not published.
      - name: description
        label: Description
        type: text
        description: Shown on the card and in link previews.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Content
        type: code
        options:
          format: markdown

  - name: about
    label: About page
    type: file
    path: content/about.md
    format: toml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: body
        label: Content
        type: code
        options:
          format: markdown
