baseURL = 'https://a1exnotes.com/'
locale = 'en-us'
title = 'Personal Cheat Sheet'
# Without this, Hugo interprets a bare front-matter date (e.g. `date =
# 2026-09-27`, no explicit offset) as UTC midnight rather than local
# midnight. Near midnight CEST/CET, the local calendar day has already
# rolled over while UTC hasn't yet, so a page dated "today" was actually
# ~1-2 hours in the future relative to UTC - and both `hugo` locally and
# the GitHub Actions build (which also runs in UTC, with no --buildFuture
# flag) silently exclude future-dated content from the build with no
# error. Setting the site's real timezone here makes bare dates resolve
# correctly relative to actual local time instead.
timeZone = 'Europe/Belgrade'

[params]
  # Site-wide fallback description, used for social preview meta tags
  # (og:description / twitter:description) on any page that has neither
  # its own front matter `description` nor enough content for Hugo to
  # auto-generate a summary from - e.g. taxonomy list pages.
  description = 'Practical notes, commands and solutions for Linux, infrastructure and automation.'

[markup]
  [markup.highlight]
    # Chroma syntax highlighting for fenced code blocks, Monokai-inspired.
    # noClasses=true (Hugo's own default) inlines each token's color as a
    # style attribute rather than emitting CSS classes, so no separate
    # generated stylesheet is needed.
    style = 'monokai'
    noClasses = true
