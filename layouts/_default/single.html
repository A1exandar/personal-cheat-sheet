<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }} — Personal Cheat Sheet</title>
    {{ partial "social-meta.html" . }}

    <link rel="icon" type="image/png" href="/favicon.png?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=41">
</head>

<body>

    <div class="site">

        {{ partial "site-header.html" . }}

        <main class="article-main">

            <article class="sheet-article{{ if eq .RelPermalink "/about/" }} about-article{{ end }}">

                <h1{{ if eq .RelPermalink "/about/" }} data-i18n="about.title"{{ end }}>{{ .Title }}</h1>

                {{ if eq .RelPermalink "/about/" }}
                    <img class="identity-wordmark about-wordmark" src="/images/a1exandar-logo.svg" alt="A1ex@ndar">
                    <div class="about-content">
                        <img class="about-profile" src="/images/aleksandar-profile.png?v=2" alt="Portrait of Aleksandar">
                        <div class="about-copy" data-i18n="about.body">
                            {{ .Content }}
                        </div>
                    </div>
                    {{ partial "mini-prompt.html" . }}
                {{ else }}
                    <p class="article-description" data-i18n="card.{{ .File.TranslationBaseName }}.description">{{ .Description }}</p>

                    {{ .Content }}
                {{ end }}

            </article>

        </main>

    </div>

    <script src="/js/i18n.js?v=8" defer></script>
    <script src="/js/nav-toggle.js?v=1" defer></script>
</body>
</html>
