<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — Personal Cheat Sheet</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=1">
    <link rel="stylesheet" href="/css/style.css?v=15">
</head>

<body>
    {{ partial "site-header.html" . }}

    <div class="site">
        <main class="sheets-main">
            <div class="sheets-intro">
                <h1 class="sheets-title">{{ .Title }}</h1>
                <p class="sheets-description">{{ .Description }}</p>
            </div>

            <div class="sheet-cards">
                {{ range .RegularPages.ByDate.Reverse }}
                <a class="sheet-card" href="{{ .RelPermalink }}">
                    <span class="sheet-card-body">
                        <h2 class="sheet-card-title">{{ .Title }}</h2>
                        <p class="sheet-card-description">{{ .Description }}</p>
                        {{ with .Params.tags }}
                        <span class="sheet-card-tags">
                            {{ range . }}<span class="sheet-card-tag">{{ . }}</span>{{ end }}
                        </span>
                        {{ end }}
                    </span>
                    <span class="sheet-card-arrow" aria-hidden="true">&rarr;</span>
                </a>
                {{ end }}
            </div>

            {{ partial "mini-prompt.html" . }}
        </main>
    </div>
</body>
</html>
